# infra/otelcol/config.yaml
# OTel Collector config — receivers (OTLP gRPC+HTTP) + memory_limiter + batch + debug exporter.
# This is the MVP configuration: trace + metric signals piped to debug (stdout).
# Add real exporters (jaeger/tempo/honeycomb/...) later as needed.

receivers:
  otlp:
    protocols:
      grpc: {}
      http: {}

processors:
  # #75: memory_limiter é SEMPRE o primeiro processor de qualquer pipeline
  # que aceite dados do receiver. Sem ele, um pico de tráfego pode OOM-kill
  # o collector. Limite a 80% do teto do container (512M → 410M soft,
  # spike 25% = 128M).
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  batch: {}

exporters:
  debug:
    verbosity: detailed
  # + exporters para backend escolhido (jaeger/tempo/honeycomb/...)

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
