      evidence: >-
        MEDIDO: `git show 444a943:.tooling/scripts/ci/ambiente-local.ts | wc -l` → 1017;
        `git show 4899a81^:.tooling/scripts/ci/ambiente-local.ts | wc -l` → 1043 (o que foi
