    - id: I-01
      severity: important
      consensus: true
      reviewers_flagged: [documentation-specialist, review-router]
      file: docs/fluxo-desenvolvimento.md
      line: 169
      what: >-
        Claim numérica FALSA, e a PR a reescreveu sem corrigir: "grep -rn 'Date.now()'
        tooling/ .tooling/ devolve **6** ocorrências (**3** num spec unitário, **3** em
        `boot-local.ts`)". O disco tem **12**.
      why: >-
        A PR trocou a frase (tirou o parêntese sobre o deadline do boot), manteve o número
        e RE-DATOU o doc (`updated: 2026-10-29` → `2026-11-03`, versão 1.3.0 → 1.4.0).
        O número já era falso na main (8) e a PR o piorou: o `ambiente-local.ts` (novo,
        no 1º ciclo) somou 4 ocorrências. O doc passa a ostentar uma data nova em cima de
        um número velho — é a classe "doc que mente" da `documentacao.md` §1.2, e
        NENHUM gate a pega (o `check-doc-claims` cobre só os 6 docs de API).
      evidence: >-
        MEDIDO: `grep -rn 'Date.now()' tooling/ .tooling/ | wc -l` → 12 (HOJE);
        `origin/main` → 8; `444a943` (tip da 1ª rodada) → 12. O doc diz 6.
        Distribuição real: 4 em `.tooling/scripts/ci/ambiente-local.ts`, 3 em
        `.tooling/scripts/ci/boot-local.ts`, 2 em `check-audit-skills.ts`, 2 em
        `tooling/scripts/lint-review-routing.spec.ts`, 1 em `tooling/scripts/review-router.spec.ts`.
      command: "grep -rn 'Date.now()' tooling/ .tooling/ | wc -l   # → 12, o doc diz 6"
      verified_by_router: true

    - id: I-02
      severity: important
      consensus: false
      reviewers_flagged: [review-router, monorepo-specialist]
      file: .tooling/scripts/ci/check-runbook-drift.ts
      line: 326
      what: >-
        A varredura derivada só enxerga o que está VERSIONADO — e isso introduz um FALSO
        POSITIVO que a versão anterior (a lista de 4 literais) não tinha: um
        `.env.example` novo, ainda não `git add`-ado, produz um gate VERMELHO acusando
        uma chave que ESTÁ no disco.
      why: >-
        A implementação antiga lia os 4 caminhos literais do DISCO (`fs.readFile`): um
        `apps/api/.env.example` recriado e não versionado era visto. A nova lê
        `git ls-files` — que só enxerga o índice. O gate é o `check-runbook-drift`, que
        ABROTA o `pre-push` e o job de preflight do CI, e a mensagem que ele manda
        ("corrrija o runbook ou o exemplo") aponta para um arquivo que já está correto.
        O caminho de reserva (sem git) tem aviso; o caminho PRINCIPAL não tem aviso nenhum
        para o caso "o arquivo existe mas não está no índice" — o escopo encolhe sem
        dizer nada, que é a falha que o próprio cabeçalho do gate diz querer eliminar.
      evidence: >-
        MEDIDO no repo real: `packages/novo/.env.example` com `CHAVE_DO_PACOTE_NOVO=x`,
        a chave na tabela do runbook →
          sem `git add`        → ok=false, "a tabela de variáveis cita 'CHAVE_DO_PACOTE_NOVO'
                                  mas essa chave não está em nenhum .env.example do repo"
          com `git add -N`     → ok=true
          com `git add`        → ok=true
        (restaurado: `git status` vazio)
      command: >-
        mkdir -p packages/novo && printf 'CHAVE_DO_PACOTE_NOVO=x\n' > packages/novo/.env.example
        # (a chave na tabela do runbook) → pnpm exec tsx -e "import {checkRunbookDrift} from
        # './.tooling/scripts/ci/check-runbook-drift'; checkRunbookDrift({repoRoot: process.cwd()}).then(r=>console.log(r.ok))"
        # → false (o arquivo está no disco; o gate não o enxerga)
      fix_sugestao: >-
        `git ls-files --cached --others --exclude-standard -- '*.env.example' '*.env.production.example'`
        — o mesmo `git ls-files`, com os não versionados e não ignorados. A regra do
        `.gitignore` continua sendo a fonte única (o `node_modules` segue de fora).
      verified_by_router: true

    # ── MINOR ────────────────────────────────────────────────────────────────
    - id: M-01
      severity: minor
      consensus: true
      reviewers_flagged: [monorepo-specialist, review-router]
      file: .tooling/scripts/ci/ambiente-local.ts
      line: 51
      what: >-
        A extração do M3 deixou 3 imports PENDURADOS: `dockerRespondeu` (51),
        `publicaPortaNasBindings` (55) e `servicoComposeDe` (56) são importados do
        `./adaptador-docker` e nunca lidos no corpo.
      why: >-
        Antes do split as 3 funções eram DEFINIDAS localmente e usadas dentro do arquivo
        (`inspecionarContainer` usava `publicaPortaNasBindings` e `dockerRespondeu`;
        `containersNaPorta` usava `servicoComposeDe`). O split as moveu para o adaptador e
        o bloco de import ficou com os 3 nomes. Nenhum gate pega: o `tsconfig.base.json`
        não declara `noUnusedLocals` e o `.tooling/` NÃO é pacote do workspace
        (`pnpm-workspace.yaml` lista `apps/*`, `packages/*`, `tooling/*` — o outro
        `tooling/`, não o `.tooling/`), logo não há ESLint sobre ele. Impacto funcional:
        ZERO (o `tsc --noEmit` passa e a suíte é verde) — é resíduo, não defeito de
        comportamento.
      evidence: >-
        MEDIDO: `pnpm exec tsc --noEmit --noUnusedLocals --noUnusedParameters -p .tooling/tsconfig.json`
        → 3× TS6133 em `ambiente-local.ts` (51, 55, 56).
        ANTES do split (`git show 4899a81^:.tooling/scripts/ci/ambiente-local.ts`) as 3
        eram `export function` LOCAIS (linhas 535, 590, 679) — não havia import pendurado.
      command: 'pnpm exec tsc --noEmit --noUnusedLocals --noUnusedParameters -p .tooling/tsconfig.json'
      verified_by_router: true

