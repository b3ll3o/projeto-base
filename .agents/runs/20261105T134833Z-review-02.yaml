        o veredito do gate, mas num registro que alguém lê para decidir "isto tem dente?",
        o mesmo parágrafo duas vezes é ruído que enfraquece a leitura.
      evidence: >-
        MEDIDO: `grep -c 'O furo que a 2ª revisão achou' .agents/specs/conventions/ci-defense-in-depth-dentes.md`
        → 2 (as duas ocorrências na MESMA linha, 70).
      command: "grep -c 'O furo que a 2ª revisão achou' .agents/specs/conventions/ci-defense-in-depth-dentes.md   # → 2"
      verified_by_router: true

    - id: M-04
      severity: minor
      consensus: false
      reviewers_flagged: [review-router]
      file: .tooling/scripts/ci/check-runbook-drift.ts
      line: 386
      what: >-
        Uma FIXTURE `.env.example` versionada passa a contar como "chave declarada" —
