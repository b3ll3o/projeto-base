      evidence: >-
        MEDIDO no repo real: `apps/api/test/fixtures/.env.example` com
        `CHAVE_SO_DE_FIXTURE=x` + a chave na tabela do runbook → gate `ok=true`.
      command: >-
        mkdir -p apps/api/test/fixtures && printf 'CHAVE_SO_DE_FIXTURE=x\n' >
        apps/api/test/fixtures/.env.example   # + a chave na tabela do runbook → gate verde
      verified_by_router: true

    # ── INFO (medido, sem defeito) ───────────────────────────────────────────
    - id: N-01
      severity: info
      consensus: true
      reviewers_flagged: [review-router, stack-code-reviewer]
      file: .tooling/scripts/ci/adaptador-docker.ts
      line: 44
      what: >-
        O `nomeDaImagem()` aceita qualquer imagem cujo REPOSITÓRIO se chame `postgres`,
        de qualquer fornecedor: `bitnami/postgres:16` → `postgres` → RELIGA, enquanto o
        irmão `bitnami/postgresql:16` → `postgresql` → recusa.
      why: >-
        O namespace é descartado de propósito (basename → sem digest → sem tag). A regra
        resultante é "o repositório da imagem se chama postgres", não "é a imagem oficial
        do Docker Hub". Não é defeito: o container que o check religa é o
        `projeto-base-pg-local` — que, por construção, é o banco local de quem desenvolve,
        e religá-lo é o remédio certo qualquer que seja o fornecedor da imagem. Fica
        registrado porque a assimetria é real (`bitnami/postgres` passa, `bitnami/postgresql`
        não) e porque o cabeçalho do arquivo fala em "o Postgres do projeto".
      evidence: >-
        MEDIDO (conjunto de aceitação completo, `tsx -e` sobre o módulo real):
          RELIGA  postgres:16-alpine / postgres / docker.io/library/postgres:16-alpine /
                 docker.io/library/postgres / postgres@sha256:abc /
                 registry.local:5000/library/postgres:16 / bitnami/postgres:16
          recusa  bitnami/postgresql:16 / postgresql:16 / postgres-alpine:1 /
                 pgvector/pgvector:pg16 / timescale/timescaledb:latest / '' / localhost:5432
      verified_by_router: true

