      command: 'git show 4899a81^:.tooling/scripts/ci/ambiente-local.ts | wc -l   # → 1043, o doc diz 1.017'
      verified_by_router: true

    - id: M-03
      severity: minor
      consensus: false
      reviewers_flagged: [documentation-specialist]
      file: .agents/specs/conventions/ci-defense-in-depth-dentes.md
      line: 70
      what: >-
        A célula do `check-runbook-drift` tem o MESMO parágrafo DUPLICADO, verbatim:
