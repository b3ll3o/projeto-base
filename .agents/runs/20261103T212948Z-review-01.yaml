      why: "O gate extrai a chave com a regex `^\\|\\s*`([A-Z][A-Z0-9_]*)`\\s*\\|`, que exige UMA chave por célula. A célula mesclada não casa → o gate acusa se a chave citada sumir de todo `.env.example`; com as 3 cegas, ninguém é avisado quando `POSTGRES_USER` sair do `.env.production.example`. Gate verde por inércia — e o próprio doc afirma na linha 260 que o gate 'casa a 1ª coluna com as chaves dos .env.example'."
      evidence: >-
