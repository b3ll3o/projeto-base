      line: 308
      what: '`clienteDoPrismaGerado()` só testa `existsSync(.prisma/client/default.js)` — e o postinstall do `@prisma/client` cria ESSE arquivo (stub que lança). O diagnóstico `sem-prisma-client` é inatingível num clone novo.'
