# specialist-router — camada 1 do pre-planner (state-aware-planning)
#
# Demanda: "faça um plano para evitar o erro P1001 (Prisma: Can't reach database
# server at localhost:5432) ao fazer o start do projeto local (`pnpm dev`)"
# Demanda de referencia: .agents/runs/20261103T144253Z-demand.txt
# Paths de referencia: .agents/runs/20261103T144253Z-paths.txt
# State snapshot: .agents/runs/state-snapshot-20261103T144253Z-start-local-sem-p1001.md
#
# NOTA DE COLLISION: existe um plano para a MESMA demanda em
# docs/superpowers/plans/2026-11-03-start-local-sem-p1001.md (untracked, escrito
# as 11:53 de 2026-11-03, branch `feat/start-local-sem-p1001` que ainda nao
# existe). Ele NAO e deste router — e a camada 2 rodando em paralelo. Os deltas
# estao em plans_aggregated.delta_com_o_plano_em_disco.

classification:
  scope: infra
  domains_detected: [docker, monorepo, nestjs, prisma, docs]
  matrix_version: 1.6
  matrix_source: .agents/specs/conventions/specialist-routing.md
  matrix_updated: 2026-10-16
  classifier: tooling/scripts/specialist-router.ts
  classifier_command: >-
    pnpm specialist:route
    --demand=.agents/runs/20261103T144253Z-demand.txt
    --paths=.agents/runs/20261103T144253Z-paths.txt
    --matrix=.agents/specs/conventions/specialist-routing.md
    --scope=infra
  classifier_exit: 0
  blocking: false
  derived_tags: [compose_with_healthcheck]
  evidence:
    path_glob:
      - apps/api/**
      - apps/api/**/infrastructure/**
      - '**/prisma/**'
      - '**/docker-compose*.yml'
      - docker-compose*.yml
      - docs/**
      - '**/*.md'
      - package.json
    demand_keyword:
      - '(?i)docker(izar|ize)?|container(iza[çc][ãa]o)?|compose'
      - "(?i)monorepo|workspace|\\bturbo\\b|pnpm.?workspace"
      - '(?i)nestjs|fastify|prisma|controller|module'
      - "(?i)\\bprisma\\b|schema\\.prisma|\\bmigrations?\\b|query lente|n\\+\\+1|índices?"
      - "(?i)\\bdoc(umenta[çc][ãa]o)?\\b|readme|adr|spec(ification)?|catálogo de rotas"
    demand_scope: [infra]
    always_on: [monorepo-specialist]

specialists_dispatched:
  - docker-specialist
  - docker-prod-specialist
  - monorepo-specialist
  - nestjs-specialist
  - prisma-db-specialist
  - documentation-specialist
  - doc-writer

