    reason: >-
      Meta-agent — gates tem vida autonoma (anti-padrao explicito do
      .agents/agents/specialist-router.md). Entrou na classificacao so pelo glob
      `package.json` (-> [monorepo-specialist, orchestrator]); nao ha trabalho
      de orquestracao a delegar, a camada 2 (writing-plans) e a camada 3
      (execucao) ja tem dono.

specialists_que_devolveram_tarde:
  - id: documentation-specialist
    note: >-
      Devolveu ~2h depois do primeiro despacho (157 tool calls). A lens dele
      NAO foi absorvida por completo: trouxe 3 achados que OS OUTROS NAO
      TINHAM — (a) a linha 293 do §4 mapeia a CLASSE
      `PrismaClientInitializationError` para "DATABASE_URL ausente ou vazia",
      quando a classe tem DOIS errorCodes (P1012 = URL vazia; P1001 = servidor
      fora do ar) — doc que MENTE (P0 por `documentacao.md` §1.2) e que e o
      BECO SEM SAIDA do G-001; (b) os 3 CORTES CONCRETOS que pagam as linhas
      novas do runbook; (c) `check-doc-refs` e `check-runbook-drift` NAO tem
      bloco de CLI — invocados direto saem 0 sem fazer nada (o "gate sem bloco
      CLI roda como no-op"). Os steps step-15, step-16 e step-17 sao dele.
      CONFIRMADO por medicao direta neste run: `docker-compose.yml:89` ja
      documenta `P1012 … You must provide a nonempty URL`; o runtime do Prisma
      expoe `errorCode`; `check-doc-refs.ts` e `check-runbook-drift.ts` tem 0
      blocos de CLI; os 4 docs donos dos cortes existem
      (health.md 160, users.md 178, rotas.md 201, docker.md 168 linhas).

gap_detected: false

plans_aggregated:
  unified_plan:
    objective: >-
      O `pnpm dev` para de quebrar com erro cru quando o banco nao esta no ar,
      se recupera sozinho do caso comum (container `projeto-base-pg-local`
      existe mas esta parado), e — quando nao e recuperavel — diz o que fazer
      com o comando exato, apontando (sem duplicar) `docs/como-rodar.md` §1.1.
      Doc e codigo coerentes (regra `documentacao.md`: doc que mente e defeito).

    steps:
      # ---------- FASE 1 — o instrumento (codigo) ----------
      - id: step-1
        owner: docker-specialist
        title: 'Criar o verificador do banco local — decisao pura + efeito'
        files:
          - .tooling/scripts/ci/banco-local.ts
          - .tooling/scripts/ci/banco-local.spec.ts
        action: >-
          Funcao pura `decideSobreBanco(estado)` -> `ok` | `subir-container` |
          `sem-banco` | `porta-ocupada`, sem docker/rede/fs (testavel sem
          maquina). Efeito: probe TCP com `node:net` (sem dependencia nova —
          `pg` nao e dep de nenhum package.json e `psql` nao existe no host),
          `docker inspect --format '{{.State.Status}}'` (argv em array, nunca
          interpolacao — o gate `check-shell-injection` recusa),
          `docker inspect --format '{{json .HostConfig.PortBindings}}'` e
          `docker inspect --format '{{.Config.Image}}'`. Le a URI de
          `AMBIENTE > apps/api/.env` (precedente do `prepara-papeis.sh:42-67`),
          reusando o `lerEnvDotEnv` JA EXPORTADO em
          `.tooling/scripts/ci/boot-local.ts:79` — sem parser duplicado.
          Portas: default 5432 quando a URI nao traz.
        command: 'npx vitest run --root .tooling/scripts/ci banco-local'
        verification: >-
          a spec cobre os 3 estados: banco inalcancavel + container PARADO ->
          `subir-container`; banco inalcancavel + container INEXISTENTE ->
          `sem-banco` (NUNCA `criar`); banco alcancavel -> `ok` E NENHUM
          `docker` chamado (o atalho nao dispara quando nao precisa). RED-GREEN:
          trocar `subir-container` por `sem-banco` derruba a spec.
        risk: >-
          `tooling/scripts/` e pacote separado e NENHEM esta em
          `RAIZES_PRODUCAO` do `check-repeticao.ts` (medido: so
          `apps/api/src`, `apps/web/app`, `apps/web/lib`,
          `apps/web/components`, `packages/shared-types/src`) — um parser de
          `.env` duplicado ali seria INVISIVEL para os gates. Da o porque de o
          script nascer em `.tooling/scripts/ci/`.

      - id: step-2
        owner: docker-specialist
        title: "Auto-recovery — `docker start` no container que ja existe, e o criterio que separa 'parado' de 'nao serve'"
        files: [.tooling/scripts/ci/banco-local.ts]
        action: >-
          Se o probe TCP falhar E o host da URI for local (localhost/127.0.0.1)
          E o container estiver `exited` E a imagem COMECAR por `postgres:`,
          executar `docker start projeto-base-pg-local` e esperar a porta abrir
          (probe TCP, ate ~15 s). Se abrir -> imprime "banco local no ar
          (container reiniciado)" e sai 0. Se NAO abrir -> o container existe
          mas nao serve: medir `publicaPorta()`; se a porta nao estiver
          publicada -> mensagem "existe mas nao publica a porta no host" +
          ponteiro ao §1.1 e sai 1. NAO recriar o container: o volume dele
          guarda as migrations e as senhas dos papeis que o
          `prepara-papeis.sh` aplica — recriar troca o volume e o app quebra
          com "role app_runtime is not permitted to log in".
        command: >-
          docker start projeto-base-pg-local &&
          docker inspect --format '{{json .HostConfig.PortBindings}}' projeto-base-pg-local &&
          node -e "const s=require('net').connect(5432,'127.0.0.1');s.on('connect',()=>{console.log('CONECTOU');s.destroy()});s.on('error',e=>console.log('ERRO',e.code))"
        verification: >-
          Medido no ambiente: `docker inspect --format '{{.State.Status}}'
          projeto-base-pg-local` -> exit 0 + `running`; container inexistente ->
          exit 1 + "no such object"; `PortBindings` -> `{"5432/tcp":[{"HostIp":"","HostPort":"5432"}]}`.
          Ao vivo: `docker stop projeto-base-pg-local && pnpm dev` -> o check
          religa o container e o `turbo run dev` SEGUE, sem P1001.
        risk: >-
          `docker start` e MUDANCA DE ESTADO na maquina de quem desenvolve.
          Medicao que para o container derruba o banco de quem estiver usando a
          maquina — medir em janela propria. `docker` ausente / sem permissao
          no socket: o script trata como "nao deu para medir" e sai com
          instrucao, NUNCA como verde.

      - id: step-3
        owner: docker-specialist
        title: 'A porta 3000 (G-003): quem ocupa e o comando exato'
        files: [.tooling/scripts/ci/banco-local.ts]
        action: >-
          Antes de subir, sondar a porta do `PORT` do `apps/api/.env` (3000).
          Se ocupada, identificar o dono SEM `lsof`/`ss` (nao portaveis):
          `docker ps --filter publish=3000 --format '{{.Names}}'`. Se devolver
          container -> a mensagem nomeia o container e da DOIS comandos:
          `docker compose stop api` (compose-aware) e `docker stop <container>`
          (nao depende do compose nem do `.env.production`). Se nao devolver
          container -> o dono e um processo local -> `pkill -f "turbo run dev"`.
          Bloquear com exit 1 e a mensagem; nunca deixar o EADDRINUSE cru do
          Nest. A mensagem NAO afirma quem e o dono quando nao da para saber.
        command: "docker ps --filter publish=3000 --format '{{.Names}}'"
        verification: >-
          MEDIDO no ambiente: o filtro devolve `projeto-base-api` e o label de
          servico e `api` (projeto Compose `base`). Com a stack no ar, o
          `pnpm dev` tem que sair 1 com a mensagem nomeando o dono e o comando
          — sem `EADDRINUSE` cru no log.
        risk: >-
          `docker compose stop api` exige `docker-compose.yml` + `.env.production`
          presente; por isso a mensagem traz `docker stop <container>` como
          alternativa que nao depende de nenhum dos dois.

      - id: step-4
        owner: monorepo-specialist
        title: 'O gancho — o `dev` da RAIZ roda o check uma vez, antes de qualquer app'
        files: [package.json]
        action: >-
          Na raiz: `"banco:check": "tsx .tooling/scripts/ci/banco-local.ts"` e
          `"dev": "pnpm banco:check && turbo run dev"`. O `&&` faz o check
          rodar UMA vez e, se ele falhar, `turbo run dev` NUNCA COMECA -> o
          `tsx watch` nunca nasce -> o watcher que sobrevive ao crash nao
          existe nesse caminho (requisito 1 e 2). NAO usar `"predev"`: o
          `.npmrc` do repo so declara `engine-strict=true` ->
          `enable-pre-post-scripts` fica no default do pnpm 9 (false) -> um
          `predev` NUNCA rodaria e o `pnpm dev` voltaria a quebrar com o P1001
          cru sem ninguem perceber (a mudanca pareceria funcionar e nao faria
          nada). NAO tocar em `apps/api/package.json`, em `turbo.json` nem no
          `dev` do web.
        command: 'node -p "require(''./package.json'').scripts.dev"'
        verification: >-
          `docker stop projeto-base-pg-local && pnpm dev` -> sai em <1 s com
          causa + ponteiro, SEM stack do Prisma; e `pgrep -af 'tsx watch
          src/main.ts'` nao devolve NADA (o watcher nunca nasceu).
        risk: >-
          O gancho nao cobre `pnpm --filter @projeto/api dev` nem `cd apps/api
          && pnpm dev` — e o `docker-compose.dev.yml:25` roda exatamente
          `pnpm --filter @projeto/api dev` DENTRO do container (la o
          `DATABASE_URL` aponta para `postgres:5432` e nao ha socket do Docker).
          Aceito: e o que a Fase de erro legivel (step-6) cobre. Registrar
          como `shortcut:` no script.

      - id: step-5
        owner: monorepo-specialist
        title: 'O check NAO entra em `ci:local`, `ci:preflight` nem no pre-push'
        files: [package.json]
        action: >-
          Deixar `ci:local`, `ci:preflight` e `.husky/pre-push` como estao: o
          check roda SOMENTE no `pnpm dev`. Medido: (a) o CI nao roda
          `pnpm ci:local` (`grep -rn 'ci:local' .github/workflows/` -> 0) ->
          entrar na cadeia nao mexeria no CI; (b) `ci:boot` ja falha com
          mensagem boa quando o banco esta fora
          (`.tooling/scripts/ci/boot-local.ts:126-128`) e o
          `.husky/pre-push:34` imprime o remedio; (c) um passo que depende do
          Docker dentro de um gate hermetico e VERDE-POR-INERCIA no CI — nao ha
          Postgres la (`ci.yml:164-165` — "Nao usar service postgres aqui — e
          dead code"): a classe 1 de `guard-classes.md`. O `ci:boot` continua
          sendo o gate e continua SEM subir o banco (decisao do repo, mantida
          no cabecalho de `boot-local.ts`).
        command: "grep -rn 'ci:local' .github/workflows/"
        verification: >-
          esperado: vazio. `time (pnpm banco:check)` -> happy path ~0,2 s
          (medido: `node -e` 25 ms + partida do `tsx` 175 ms + probe TCP 37 ms
          + `docker inspect` 12 ms; no caminho feliz o check nem chama o
          docker). `pnpm ci:preflight` -> verde: o preflight nao conhece o
          script novo (`preflight-gates.ts` e a fonte unica dos gates).
        risk: >-
          Quem roda `pnpm ci:local` com o banco parado continua falhando no
          `ci:boot` (com o ponteiro, nao com stack cru) — o start e o que foi
          pedido, o push nao muda de comportamento.

      - id: step-6
        owner: nestjs-specialist
        title: 'RED — spec da funcao pura que traduz o P1001 em mensagem legivel'
        files:
          - apps/api/src/shared/infrastructure/prisma/traducao-de-falha-de-conexao.spec.ts
        action: >-
          Spec no padrao da casa (spec irma do arquivo, projeto `unit` do
          Vitest). Tres casos, o minimo que prova o conserto: (1) P1001 + alvo
          local -> a mensagem contem `P1001`, o alvo `localhost:5432`,
          `projeto-base-pg-local`, `docker start projeto-base-pg-local` e
          `docs/como-rodar.md`, e NAO contem a senha do DATABASE_URL (guarda
          anti-vazamento — a URL tem credencial); (2) erro SEM `errorCode` ->
          a funcao devolve `undefined`; (3) `errorCode` `P1000` -> `undefined`
          (prova que so o P1001 e traduzido e nada e mascarado). O RED nasce
          porque o modulo ainda nao existe.
        command: >-
          pnpm --filter @projeto/api exec vitest run --project unit src/shared/infrastructure/prisma/traducao-de-falha-de-conexao.spec.ts
        verification: "mesmo comando — falha com 'Cannot find module' (RED), depois verde"
        risk: >-
          A spec do SERVICO (step-9) depende do guard
          `verificarCredenciaisDoBanco`, que roda ANTES do `$connect` e le
          process.env: se o env do teste nao for stubado, o guard recusa e o
          teste cai pelo motivo errado.

      - id: step-7
        owner: nestjs-specialist
        title: 'GREEN — a funcao pura de traducao, em `shared/infrastructure/prisma/`'
        files:
          - apps/api/src/shared/infrastructure/prisma/traducao-de-falha-de-conexao.ts
        action: >-
          Arquivo NOVO, no mesmo diretorio de `credenciais-do-banco.ts` e
          `papel-de-runtime.ts`. POR QUE AI (lens DDD/Hexagonal): a funcao
          conhece o `errorCode` do Prisma — isso e INFRAESTRUTURA (adapter), nao
          dominio nem aplicacao; `domain/` e `application/` nao a importam (regra
          ddd-h2), so `prisma.service.ts` importa. Assinatura:
          `traduzirFalhaDeConexao(erro: unknown, databaseUrl: string | undefined): string | undefined`
          — devolve `undefined` quando NAO e P1001 (o caller repassa o erro
          original intacto). Deteccao por duck-typing em `errorCode` (sem
          `instanceof Prisma.*`): a spec nao precisa do Prisma Client gerado.
          Alvo (host/porta) sai do DATABASE_URL via `new URL(...)` — o mesmo
          truque do `senhaDaUri` em `credenciais-do-banco.ts`; NUNCA incluir
          user/senha. Mensagem (alvo local): causa (o `postgres` do compose usa
          so `expose:` desde o #91 e nao e alcancavel do host; o banco local e
          o container `projeto-base-pg-local`) + comando de UM comando que
          resolve o caso medido (`docker start projeto-base-pg-local`) +
          ponteiro ao §1.1. Alvo NAO local (ex.: `postgres:5432` dentro do
          compose): mensagem que NAO recomenda container que nao existe no host.
          A formulacao NAO duplica o §1.1: nao repete o bloco `docker run` (a
          receita de criacao do zero e do §1.1).
        command: >-
          pnpm --filter @projeto/api exec vitest run --project unit src/shared/infrastructure/prisma/traducao-de-falha-de-conexao.spec.ts
        verification: 'mesmo comando — verde; e `pnpm --filter @projeto/api typecheck` sem erro'
        risk: >-
          Traduzir so o P1001 deixa P1000 (senha errada) e P1003 (banco
          inexistente) crus. Limitacao ACEITA — o caso medido e P1001; o
          gatilho para ampliar e alguem bater em P1000 cru no boot. A guarda de
          credenciais do #118 ja recusa a senha EXPOSTA antes de conectar.

      - id: step-8
        owner: nestjs-specialist
        title: 'Ligar a traducao no `onModuleInit` — try/catch no `$connect`, rethrow intacto'
        files:
          - apps/api/src/shared/infrastructure/prisma/prisma.service.ts
        action: >-
          Só o `$connect()` (hoje linha 46) e protegido; o guard de credenciais
          (37-44) ja lanca `Error` legivel e NAO se mexe.
          `try { await this.$connect(); } catch (erro) { const traducao =
          traduzirFalhaDeConexao(erro, process.env['DATABASE_URL']); if
          (traducao === undefined) throw erro; throw new Error(traducao); }`
          Sem `process.exit` dentro do hook: quem mata o processo e o
          `bootstrap().catch()` do main.ts (ja existente) — sair dentro do hook
          mataria sem `$disconnect`. POR QUE (a) e NAO um check TCP pre-boot:
          no NestJS 11.2.5 o `onModuleInit` roda DENTRO de `app.listen()` ->
          `init()` -> `callInitHook()` (`nest-application.js:106`), e o log
          "Nest application successfully started" (linha 109) sai DEPOIS do
          hook — VERIFICADO no fonte instalado. Logo, com P1001 a porta nunca e
          escutada e o log de sucesso nunca mente; um check pre-boot nao compra
          nada e ainda duplicaria a I/O de conexao.
        command: >-
          pnpm --filter @projeto/api exec vitest run --project unit src/shared/infrastructure/prisma
        verification: 'mesmo comando — verde; `pnpm --filter @projeto/api typecheck` sem erro'
        risk: >-
          O `throw erro` preserva a instancia e o stack originais (bom), mas o
          main.ts imprime o objeto Error inteiro — a mensagem legivel vem na
          PRIMEIRA linha e o stack continua abaixo. Aceitavel (o stack ajuda
          nos erros nao traduzidos).

      - id: step-9
        owner: nestjs-specialist
        title: 'Spec do servico — prova de que erro NAO-P1001 sai intacto'
        files:
          - apps/api/src/shared/infrastructure/prisma/prisma.service.spec.ts
        action: >-
          Ampliar a spec existente (mesma pasta, mesma convencao `*.spec.ts`).
          Caso A (NAO-P1001): mock de `$connect` que rejeita com `Error('boom')`
          simples -> `await expect(svc.onModuleInit()).rejects.toBe(erro)` — a
          MESMA instancia. Caso B (P1001): rejeita com `{ errorCode: 'P1001',
          message: '...' }` -> `rejects.toThrow(/P1001/)`. Guardar o env do
          teste com `vi.stubEnv` (`NODE_ENV=development`,
          `DATABASE_URL=app_runtime:<senha-de-teste-local>@localhost:5432/db`
          — senha que nao esta em `SENHAS_EXPOSTAS=['app_runtime_dev']` nem
          comeca com `change_me`/`***`), senao o guard recusa antes do
          `$connect` mockado e o teste falha pelo motivo errado. Usar
          `vi.spyOn(PrismaService.prototype, '$connect')` para NAO tocar a rede.
        command: >-
          pnpm --filter @projeto/api exec vitest run --project unit src/shared/infrastructure/prisma/prisma.service.spec.ts
        verification: 'mesmo comando — verde'
        risk: >-
          `new PrismaService()` no teste instancia o PrismaClient real (a spec
          existente ja faz isso e passa). O mock de `$connect` evita I/O.
          `vi.mock` do guard seria alternativa, mas o factory cache do `vi.mock`
          (armadilha ja registrada no repo) e mais fragil que `vi.stubEnv`.

      - id: step-10
        owner: nestjs-specialist
        title: 'main.ts — a linha que diz que a API MORREU'
        files: [apps/api/src/main.ts]
        action: >-
          O `bootstrap().catch()` (linhas 123-126) hoje imprime "Bootstrap
          falhou:" + o Error e da `process.exit(1)`. Acrescentar UMA linha
          generica depois do erro, para ninguem achar que o boot continua:
          `console.error('API encerrada (codigo de saida 1). Corrija a causa acima e rode de novo.')`
          Generica de proposito: a linha NAO aponta §1.1, porque nem toda falha
          de boot e de banco (ex.: `ALLOWED_ORIGINS` em producao, main.ts:80-87)
          — o ponteiro para §1.1 fica DENTRO da mensagem do P1001, onde a causa
          e o banco.
        command: 'pnpm --filter @projeto/api dev'
        verification: >-
          com o container `projeto-base-pg-local` parado, o terminal mostra as
          3 linhas do P1001 + "API encerrada (codigo de saida 1)"
        risk: 'nenhum — e texto de log; o exit 1 ja existia'

      # ---------- FASE 2 — a doc (a fonte da verdade) ----------
      - id: step-11
        owner: doc-writer
        title: 'README Opcao B: a ponte ao §1.1 no lugar do `docker run` que quebra (G-002)'
        files: [README.md]
        action: >-
          README.md:123 traz o `docker run -d --name projeto-base-pg-local -p
          5432:5432 -e POSTGRES_USER=projeto -e POSTGRES_PASSWORD=projeto -e
          POSTGRES_DB=projeto_base postgres:16-alpine` — o MESMO comando, byte
          a byte, que esta em `docs/como-rodar.md:66-68`. Com o container ja
          existente, `docker run` responde "name already in use" e a pessoa fica
          sem saida: e o G-002. O README.md:121-123 vira PONTE ao §1.1 — no
          MESMO passo 2 (nao em nota de rodape), porque quem so le o README
          precisa achar o caminho. O §1.1 ja tem o `docker start` do container
          que existe (linha 74) e ja tem o `docker run` da primeira vez (66-68).
          O §1.1 (doc) e o dono da receita; o codigo e o dono de runtime.
        command: 'grep -n "projeto-base-pg-local" README.md'
        verification: >-
          `grep -c "docker run -d --name projeto-base-pg-local" README.md
          docs/como-rodar.md` -> 0 no README, 1 no runbook (o comando passa a
          ter UM dono)
        risk: >-
          Perder o comando no README tira o sintoma do ponto de entrada —
