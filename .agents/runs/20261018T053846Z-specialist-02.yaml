conflicts_resolved_detail:
  - id: C1
    titulo: 'Chave de permissao (test-writer vs nestjs-specialist)'
    resolucao: 'nestjs ja decidiu D2 = chave NOVA admin.manage-feature-flags. Isso FECHA a branch (a) que o test-writer deixou aberta: passa a ser obrigatorio seed/backfill de Authorization para os perfis existentes + crescimento do spec do catalogo. O 403 spec e identico nas duas branches, mas backfill e spec do catalogo so existem nesta.'
  - id: C2
    titulo: 'Mecanismo do toggle (ux-design vs nextjs)'
    resolucao: "nextjs escolheu RSC puro + <form> por linha + Server Action (padrao F11, sem 'use client' na pagina). ux quer flip imediato de 1 clique. Merge: a PAGINA continua Server Component; so o interruptor vira ilha client com useOptimistic para o flip imediato, e o SERVE ACTION por linha faz a gravacao. Satisfez os dois. O 'Salvar' compartilhado de F11 fica de fora — diff-then-save e para form N-item, nao para toggle atomico."
  - id: C3
    titulo: 'Escopo global vs por-tenant (nestjs D1 vs prisma-db-specialist)'
    resolucao: 'ABERTO — ver conflicts_open O1. Os dois discordam sobre existir coluna tenant_id.'
  - id: C4
    titulo: 'Dono dos arquivos tocados por 2 specialists'
    resolucao: "Dedup por owner unico, com o outro entregando especificacao: page.tsx -> nextjs (ux entrega tokens/estados); e2e spec F14 -> test-writer (nextjs web-4 e ux ui-07/ui-08 sao o MESMO step); Sidebar -> nextjs (ux entrega o rotulo 'Funcionalidades'); feature-flag.ts em shared-types -> nestjs escreve o tipo, monorepo executa o edit."

conflicts_open:
