    titulo: 'Existe coluna tenant_id em feature_flags?'
    posicao_nestjs: "D1 — sem tenant_id. Demanda diz 'administrador do SISTEMA'. Per-tenant nao foi pedido."
    posicao_prisma: 'tenantId nullable, NULL = global. Argumento: sem a coluna, o caminho quente de leitura nao consegue enxergar a flag por tenant depois.'
    nota: "Prisma-db e o DONO do schema (AGENTS.md: 'Dono do schema Prisma em apps/api/prisma/'). A demanda literal nao pede por-tenant."
    meu_lean: 'Sem tenant_id (o menor diff que faz o job). Nullable so se o prisma-db-specialist sustentar o caso do caminho quente com medicao, nao com argumento.'
    resolucao_requerida: 'prisma-db-specialist, antes de p1 fechar.'
