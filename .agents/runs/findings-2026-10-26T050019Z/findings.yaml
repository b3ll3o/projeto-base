opened_issues:
  - id: sec-001
    number: 117
    url: https://github.com/b3ll3o/projeto-base/issues/117
    title: 'P0 — Command injection no lint de review-routing: nome de arquivo do PR executa comando no CI'
    specialist: security-auditor
    severity: P0
    type: bug
    labels: [agent:security-auditor, severity:p0, type:bug]
    duplicate_of: null
    status: new
    title_pt_br: 'Command injection no lint de review-routing: nome de arquivo do PR executa comando no CI'
    location: 'tooling/scripts/lint-review-routing.ts:100'
    cause: |
      execSync recebe string e a entrega ao shell (/bin/sh -c). JSON.stringify nao
      neutraliza $( ) nem crase — a expansao acontece DENTRO das aspas duplas.
      O vetor e o nome do arquivo, controlado por quem abre o PR, via git ls-files.
    impact: |
      Execucao de comando arbitrario no runner do GitHub Actions em todo pull_request
      que chega ao job preflight. Repo publico => qualquer pessoa pode abrir PR com
      nome de arquivo escolhido. Com pull_request_target o codigo roda com segredos
      do repo. Falha silenciosa: o comando executado nao aparece em log de erro.
    evidence: |
      PoC reproduzido neste scan, do zero, em repo git descartavel:
      arquivo "$(touch PWNED).ts" commitado -> git ls-files devolve o nome ->
      execSync(`git check-ignore ${JSON.stringify(f)}`) -> marcador PWNED criado.
      Cadeia CI verificada por leitura: ci.yml:13 (pull_request) -> ci.yml:101
      (pnpm ci:preflight) -> preflight.ts:79 (review:lint) -> package.json raiz ->
      tooling/scripts/package.json -> lint-review-routing.ts:87 (git ls-files) -> :100.
    fix: |
      Trocar execSync por execFileSync com argv em array e '--' antes do path.
      Auditar os outros execSync de tooling/scripts/. Adicionar teste de regressao
      que constroi filePath com $( ) e afirma que nada e criado.
    breaking_change: false
    confirmed_by: [security-auditor, orchestrator] # PoC reproduzido independentemente

  - id: sec-002
    number: 118
    url: https://github.com/b3ll3o/projeto-base/issues/118
    title: 'P0 — Senha do papel app_runtime versionada em texto puro permite bypass total do RLS multi-tenant'
    specialist: security-auditor
    severity: P0
    type: bug
    labels: [agent:security-auditor, severity:p0, type:bug]
    duplicate_of: null
    status: new
    title_pt_br: 'Senha do papel app_runtime versionada em texto puro permite bypass total do RLS multi-tenant'
    location: 'apps/api/prisma/migrations/20261020000000_rls_isolation_empresa/migration.sql:32'
    cause: |
      A senha do role e constante versionada (migration.sql:32 e papel-de-runtime.ts:26),
      em repo PUBLICO. E o escopo de tenant e um GUC de sessao que o proprio cliente
      define (app.tenant_id), cujo valor '*' (bucket de sistema) e aceito por
      no_escopo_atual. NOBYPASSRLS impede o papel de pular a policy; nao impede o
      papel de escolher o valor do GUC.
    impact: |
      Bypass total do isolamento multi-tenant: com a senha publica, um atacante le e
      ESCREVE dados de todas as empresas, contornando a defesa central do produto.
      PoC do specialist ja alterou dados de outra empresa. Postgres nao tem ports:
      no compose (so expose:), entao falta rota de rede ate o container — mas a
      issue irma de command injection da essa rota. Rotacao de senha em prod e passo
      manual sem gate.
    evidence: |
      gh repo view -> visibility PUBLIC.
      grep -rn app_runtime_dev -> migration.sql, papel-de-runtime.ts, .env.production.example.
      migration.sql:106-110: escopo_atual() = '*' OR alvo::text = escopo_atual().
      PoC do specialist (Postgres 16 real, migrations do repo): SET app.tenant_id='*'
      devolveu todos os usuarios de todas as empresas; UPDATE alterou b@globex.test.
    fix: |
      (1) senha fora do repo (env/secret manager; role criado por infra ou sem senha
      na migration); (2) escopo nao escolhivel livremente — '*' exige credencial
      separada da de aplicacao; (3) guard de boot que recuse a senha de dev conhecida;
      (4) rotacionar a senha publicada (esta no historico git publico).
    breaking_change: false
    confirmed_by: [security-auditor]

  - id: sec-005
    number: 119
    url: https://github.com/b3ll3o/projeto-base/issues/119
    title: 'P1 — GET /users ignora a permissao users.read no escopo de tenant: membro sem a permissao le o diretorio inteiro'
    specialist: security-auditor
    severity: P1
    type: bug
    labels: [agent:security-auditor, severity:p1, type:bug]
    duplicate_of: null
    status: new
    title_pt_br: 'GET /users ignora a permissao users.read no escopo de tenant: membro sem a permissao le o diretorio inteiro'
    location: 'apps/api/src/modules/users/infrastructure/http/users.controller.ts:343'
    cause: |
      semDireito (permissao) e calculado nas linhas 291-295 e aplicado dentro de um
      && cujo primeiro membro e (empresa === null || perfilNaoResolveuParaOEscopo)
      (sinal de VINCULO). No caso "membro de tenant com perfil resolvido" o primeiro
      membro e false, o && inteiro e false, e somenteUsuarioId fica null: sem
      recorte. A permissao users.read e calculada e descartada.
    impact: |
      users.read nao e aplicada em nenhum lugar de fato. Qualquer membro com
      qualquer perfil (inclusive invited/pending ou customizado sem permissao) ve
      nome e e-mail de todos os membros da empresa. A web mascara o vazamento
      (decidirAtribuicaoPerfil filtra antes), ou seja a protecao esta na camada
      errada e nao vale para nenhum outro cliente da API.
    evidence: |
      users.controller.ts:291-295 (semDireito) e :336,:343-346 (aplicacao).
      Ausencia de @RequirePermission na rota e deliberada (users.controller.ts:205).
      Intencao de produto em docs/superpowers/plans/2026-10-18-auditoria-6-defeitos.md:313
      ("membro com users.read continua vendo o diretorio da empresa" — caso negativo).
      PoC do specialist (API real): conta com perfil de tenant e permissions: []
      recebeu HTTP 200 com o diretorio completo do tenant.
    fix: |
      Separar recorte por vinculo (semVinculo) de recorte por permissao (semDireito)
      e aplicar os dois: deveRecortar = perfilNaoResolveuParaOEscopo || semDireito.
      Preservar o caso negativo do #102 (membro COM users.read continua vendo o
      diretorio). Testar os 4 casos: sem users.read, com users.read, sem vinculo,
      header alheio.
    breaking_change: false
    confirmed_by: [security-auditor]

  - id: sec-004
    number: 120
    url: https://github.com/b3ll3o/projeto-base/issues/120
    title: 'P1 — JWT_SECRET com placeholder CHANGE_ME e aceito como segredo valido: token de admin forjavel'
    specialist: security-auditor
    severity: P1
    type: gap
    labels: [agent:security-auditor, severity:p1, type:gap]
    duplicate_of: null
    status: new
    title_pt_br: 'JWT_SECRET com placeholder CHANGE_ME e aceito como segredo valido: token de admin forjavel'
    location: '.env.production.example:65'
    cause: |
      lerChaveObrigatoria (jwt-token.service.ts:201-214) recusa apenas string vazia
      apos trim(). O placeholder CHANGE_ME_gerar_com_openssl_rand_base64_48 e uma
      string nao vazia: passa e vira a chave de assinatura HS256 real. O guard
      responde "tem valor?", nao "e um valor que eu aceitei como segredo?".
    impact: |
      Forja de token de qualquer usuario, inclusive admin global — o segredo esta
      publico no repo. Sem sintoma: nao ha erro de boot nem log; a API assina tokens
      com chave publica. Mesmo padrao no GF_SECURITY_ADMIN_PASSWORD (:118), que o
      proprio example admite ("aqui nao ha downstream que recuse o boot").
    evidence: |
      .env.production.example:65 e :118 com CHANGE_ME_.
      jwt-token.service.ts:201-214: if (!chave) { throw } — unico guard.
      Verificado por leitura: JWT_SECRET nao e referenciado em nenhum outro lugar do
      codigo-fonte alem do config.get acima.
    fix: |
      Recusar placeholders conhecidos e exigir >= 32 bytes no mesmo lugar onde ja se
      recusa o vazio; mesmo guard para GF_SECURITY_ADMIN_PASSWORD; gate de preflight
      que falhe quando .env.production contiver CHANGE_ME em chave de segredo.
    breaking_change: false
    confirmed_by: [security-auditor]

  - id: sec-006
    number: 121
    url: https://github.com/b3ll3o/projeto-base/issues/121
    title: 'P1 — Seed promove o primeiro usuario a admin global fora do guard de NODE_ENV=development'
    specialist: security-auditor
    severity: P1
    type: bug
    labels: [agent:security-auditor, severity:p1, type:bug]
    duplicate_of: null
    status: new
    title_pt_br: 'Seed promove o primeiro usuario a admin global fora do guard de NODE_ENV=development'
    location: 'apps/api/prisma/seed.ts:170'
    cause: |
      O seed tem dois passos que concedem admin e so um esta protegido. O passo 4
      (cria admin@admin.com) tem guard NODE_ENV=development + host local e throw
      explicito; o passo 5 (promove o primeiro user a admin, conectando como DONA)
      esta fora de qualquer condicao de ambiente. A documentacao do proprio passo 4
      diz que o admin local "e de DEV" — o passo 5 concede o mesmo admin sem o guard.
    impact: |
      Escalada de privilegio trivial: POST /users e @Public(), entao qualquer pessoa
      cria a conta; rodar o seed promove essa conta a admin global (is_admin, todas
      as permissions, tenant_id NULL) como DONA, ignorando RLS. O seed fecha com
      "OK" e imprime "primeiro user virou admin". Condicional a rodar o seed fora de
      dev — mas esse e o caminho documentado (docs/como-rodar.md:140).
    evidence: |
      seed.ts:129-131 (guard do passo 4) e :162-167 (throw).
      seed.ts:164-180 (passo 5 sem guard, com findFirst por createdAt + update de profileId).
      users.controller.ts:153-154: @Public() @Post().
      docs/como-rodar.md:140 documenta "pnpm exec tsx prisma/seed.ts".
      PoC do specialist com NODE_ENV=production: primeira conta promovida a admin.
    fix: |
      Aplicar ao passo 5 o mesmo guard do passo 4, mais estrito (so DEV + host local),
      com throw nomeando o motivo. Em producao, promover pelo endpoint admin
      auditado (POST /api/v1/admin/users/:id/profile), que grava users_history.
      Separar seed:dev de seed:admin.
    breaking_change: false
    confirmed_by: [security-auditor]

  - id: sec-007
    number: 122
    url: https://github.com/b3ll3o/projeto-base/issues/122
    title: 'P1 — Swagger do OpenAPI exposto em producao sem condicao de NODE_ENV'
    specialist: security-auditor
    severity: P1
    type: gap
    labels: [agent:security-auditor, severity:p1, type:gap]
    duplicate_of: null
    status: new
    title_pt_br: 'Swagger do OpenAPI exposto em producao sem condicao de NODE_ENV'
    location: 'apps/api/src/main.ts:105'
    cause: |
      SwaggerModule.setup e chamado sem condicao de ambiente, enquanto o CORS 20
      linhas acima tem guard NODE_ENV=production que aborta o bootstrap na config de
      dev. O JwtAuthGuard e aplicado por controller (@UseGuards), nao globalmente,
      entao /api/docs fica sem autenticacao. O servico escuta em 0.0.0.0 e o compose
      publica 3000:3000.
    impact: |
      Documento completo da API publico em producao: paths, metodos, parametros,
      schemas de DTO e descricoes — enumerao de superficie (rotas admin, tenancy,
      auth) para quem nao tem acesso. /api/docs-json e consumivel por ferramenta
      (geracao de client). Sem autenticacao nem throttling.
    evidence: |
      main.ts:98-105 (Swagger sem guard) vs main.ts:79-90 (CORS com guard).
      app.module.ts:83: APP_GUARD e so o ThrottlerGuard; JwtAuthGuard e por controller
      (7 controllers). docker-compose.yml:147-148: ports 3000:3000.
      PoC do specialist: GET /api/docs -> 200 e /api/docs-json -> 200, sem auth.
    fix: |
      Condicionar o Swagger a NODE_ENV != production, com o mesmo padrao do CORS.
      Alternativa: flag SWAGGER_ENABLED desligada em .env.production.example, com
      o default desligado em prod. Se a doc precisa ficar acessivel, proteger a rota
      em vez de remove-la.
    breaking_change: false
    confirmed_by: [security-auditor]

  - id: code-001
    number: 123
    url: https://github.com/b3ll3o/projeto-base/issues/123
    title: 'P1 — Reatribuicao idempotente de perfil responde 412: a ancora do optimistic lock assume um version++ que nao aconteceu'
    specialist: code-reviewer
    severity: P1
    type: bug
    labels: [agent:code-reviewer, severity:p1, type:bug]
    duplicate_of: null
    status: new
    title_pt_br: 'Reatribuicao idempotente de perfil responde 412: a ancora do optimistic lock assume um version++ que nao aconteceu'
    location: 'apps/api/src/modules/profiles/application/profiles.use-cases.ts:745'
    cause: |
      save(user, user.version() - 1) pressupoe exatamente um version++ no mutador.
      Mas atribuirPerfil e idempotente (user.aggregate.ts:274-276: return sem
      incrementar). A ancora fica uma unidade abaixo da versao persistida, o
      updateMany otimista casa zero linhas e o 412 sai. O agregado User nao tem
      loadedVersion() — o Profile tem (profile.aggregate.ts:271-272), e o comentario
      do repositorio aponta exatamente para o padrao correto.
    impact: |
      PUT idempotente por contrato HTTP falha com 412 na segunda chamada. O web nao
      aciona o bug (decidirAtribuicaoPerfil filtra antes), ou seja o contrato da API
      esta quebrado por baixo dele. 412 fala "conflito de concurrencia" quando nao ha
      conflito — diagnostico errado. Invisivel para a suite: o fake do repo ignora
      expectedVersion (prefixado com _), e nao ha spec de integracao nem e2e que
      reatribua o mesmo perfil.
    evidence: |
      profiles.use-cases.ts:745. user.aggregate.ts:274-276 (early return idempotente).
      prisma-user.repository.ts:106-107 (where version: expectedVersion).
      grep loadedVersion em user.aggregate.ts -> sem ocorrencias; em profile.aggregate.ts
      -> linhas 106, 271-272.
      profiles.use-cases.spec.ts:122-125: fake ignora expectedVersion.
      Reproducao HTTP real do specialist: PUT -> 200, PUT igual -> 412 "versao
      esperada 1, encontrada 2". Mesmo erro com profileId:null sobre alvo sem perfil.
    fix: |
      Dar ao agregado User o loadedVersion() que o Profile tem, e usar
      user.loadedVersion() como ancora. Fazer atribuirPerfil sempre incrementar
      quebraria a idempotencia semantica e o comentario do repo avisa que um save
      pode ter varios mutadores atras. Alongar o fake do spec para respeitar
      expectedVersion.
    breaking_change: false
    confirmed_by: [code-reviewer]

  - id: code-002
    number: 124
    url: https://github.com/b3ll3o/projeto-base/issues/124
    title: 'P1 — Query params de /users sem validacao: limit e cursor invalidos respondem 500 em vez de 400'
    specialist: code-reviewer
    severity: P1
    type: bug
    labels: [agent:code-reviewer, severity:p1, type:bug]
    duplicate_of: null
    status: new
    title_pt_br: 'Query params de /users sem validacao: limit e cursor invalidos respondem 500 em vez de 400'
    location: 'apps/api/src/modules/users/infrastructure/http/users.controller.ts:339'
    cause: |
      Number(limit) sem validacao: 'abc' -> NaN, '1e999' -> Infinity. O valor vai
      direto para take: input.limit + 1; o Prisma valida o argumento antes de abrir
      conexao e lanca PrismaClientValidationError, que mapExceptionToHttp nao mapeia
      -> fall-through INTERNAL_SERVER_ERROR. cursor cru num slot @db.Uuid -> P2023,
      mesmo fall-through. O ZodValidationPipe global e z.any() (noop) e so cobre
      @Body. Alem disso: as duas implementacoes do mesmo port discordam sobre o
      clamp — Prisma sem clamp (take: input.limit + 1), in-memory com clamp [1,100].
      E o :id da rota de historico vai cru, sem UserId.create, quebrando a garantia
      que o proprio guard de ownership afirma.
    impact: |
      Entrada invalida produz 500 onde o contrato diz 400 VALIDATION_ERROR (as rotas
      de perfil ja devolvem 400 para limit invalido no corpo — a API e inconsistente
      consigo mesma). 500 em erro de input polui o sinal de erro. limit sem teto
      carrega a base inteira em memoria. limit=0 e limit=-5 respondem 200 com lista
      VAZIA — falha silenciosa: o cliente recebe "nao ha mais usuarios" quando ha.
      A rota de historico quebra a garantia documentada do guard.
    evidence: |
      users.controller.ts:338-339 e :495-496 (Number(limit) cru); :494 (entityId: id cru).
      main.ts:95: ZodValidationPipe(z.any()).
      user-ownership.guard.ts:65-70: o guard afirma "a deferencia e segura" — vale
      para as 4 rotas com UserId.create (user-use-cases.ts:180,217,238,271), nao para
      a rota de historico.
      Medico (repositorio Prisma real, 12 usuarios semeados):
        limit=20 -> 14 | limit=5 -> 5 | limit=0 -> 0 (sem erro) | limit=-5 -> 0 (sem erro).
      HTTP real: ?limit=abc -> 500 | ?limit=1e999 -> 500 | ?cursor=nao-e-uuid -> 500 |
      /users/not-a-uuid -> 400 | /users/not-a-uuid/history -> 500.
    fix: |
      Validar @Query na borda (z.coerce.number().int().min(1).max(100) e z.string().uuid()
      para cursor) com ZodValidationPipe por rota, como o repo ja faz em @Body.
      Validar o :id da rota de historico com UserId.create. Registrar a faixa [1,100]
      no UserRepositoryPort para as duas implementacoes concordarem, ou clampar no
      controller (fonte unica).
    breaking_change: false
    confirmed_by: [code-reviewer]

  - id: openapi-001
    number: 125
    url: https://github.com/b3ll3o/projeto-base/issues/125
    title: 'P1 — OpenAPI sem versionar e sem gate: 7 de 9 controllers sem @ApiTags e 16 endpoints sem @ApiOperation'
    specialist: openapi-contract-specialist
    severity: P1
    type: gap
    labels: [agent:openapi-contract-specialist, severity:p1, type:gap]
    duplicate_of: null
    status: new
    title_pt_br: 'OpenAPI sem versionar e sem gate: 7 de 9 controllers sem @ApiTags e 16 endpoints sem @ApiOperation'
    location: 'apps/api/openapi.json'
    cause: |
      A spec e gerada por script e fica no .gitignore, e nenhum workflow a exporta
      — a politica "gitignore + export no CI" foi feita pela metade. Sem baseline
      versionado nao ha contra o que comparar, entao o drift nao e detectavel.
      Em cima disso, a cobertura de decorators do @nestjs/swagger esta incompleta:
      onde falta @ApiTags/@ApiOperation o documento sai incompleto, sem erro.
    impact: |
      O contrato publicado esta errado: 5 paths / 8 operacoes contra 9 controllers no
      codigo (faltam /auth/*, /admin/profiles/*, /admin/users/*, /admin/permissions,
      /me/profile, /tenancy/*, /admin/flags/*). 7 controllers caem no grupo
      "default" do Swagger UI; 16 endpoints ficam com summary vazio. O drift nao e
      detectavel — ninguem descobre que a spec esta errada.
    evidence: |
      git ls-files --error-unmatch apps/api/openapi.json -> nao versionada.
      git check-ignore -v -> .gitignore:11. stat -> mtime 2026-10-13 13:59 (artefato
      local de 13 de outubro, anterior a 6 dos 9 controllers).
      grep -rn openapi .github/workflows/ci.yml -> sem ocorrencias (nenhum export no CI).
      7 controllers sem @ApiTags (tenancy, health, feature-flags, admin-authorizations,
      admin-users, me-profile, admin-profiles); 16 endpoints sem @ApiOperation.
      jq '.paths|keys' -> 5 paths; 8 operacoes.
    fix: |
      Versionar apps/api/openapi.json (sai do .gitignore) e adicionar
      .tooling/scripts/ci/check-openapi-contract.ts, no padrao dos checks existentes,
      rodando no job preflight: exporta, compara com a spec versionada, falha se
      mudou. Fechar a cobertura de decorators (9/9 @ApiTags, @ApiOperation em todos).
      Opcional: gate de breaking change contra a tag anterior.
    breaking_change: false
    confirmed_by: [openapi-contract-specialist]

  - id: relver-001
    number: 126
    url: https://github.com/b3ll3o/projeto-base/issues/126
    title: 'P1 — version footers dos 4 docs canonicos divergentes: release-template vai falhar no proximo tag'
    specialist: release-versioning-specialist
    severity: P1
    type: drift
    labels: [agent:release-versioning-specialist, severity:p1, type:drift]
    duplicate_of: null
    status: new
    title_pt_br: 'version footers dos 4 docs canonicos divergentes: release-template vai falhar no proximo tag'
    location: 'docs/STACK.md:146'
    cause: |
      O bump e manual e nao-atomico: quem versiona edita o footer do MONOREPO.md (o
      unico que o workflow le) e nao propaga para STACK.md, TEMPLATE_USAGE.md e
      estrutura-e-versionamento.md. O workflow detecta o drift, mas so depois que
      alguem tenta o release, e abortando o release em vez de falhar no PR.
      Recorrencia: a issue #67 (fechada) foi o mesmo drift com os mesmos docs.
    impact: |
      O proximo release FALHA: com o alvo vindo de MONOREPO (1.12.0), o STACK_ver
      (1.11.0) e o tpl_ver (1.11.0) divergem -> drift=1 -> exit 1. 18 commits sem
      tag (7 feat, 7 fix, 0 breaking) ficam pendentes, incluindo features entregues
      (#109 flags, #101 tenancy, #97 RBAC). Leitor novo ve duas versoes diferentes;
      TEMPLATE_USAGE.md (doc de integracao do template) e o pior lugar para divergir.
    evidence: |
      docs/MONOREPO.md:277 = 1.12.0 | docs/STACK.md:146 = 1.11.0 |
      .agents/specs/conventions/estrutura-e-versionamento.md = 1.12.0 |
      docs/TEMPLATE_USAGE.md:168 = 1.11.0.
      git tag --sort=-v:refname | head -1 -> v1.11.0; git log v1.11.0..HEAD | wc -l -> 18.
      Classificacao: breaking 0, feat 7, fix 7, other 4 -> bump minor (1.12.0).
      .github/workflows/release-template.yml:98-118: o gate compara os 4 footers com o
      target e faz exit 1 se qualquer um divergir.
      Precedente: issue #67 (fechada) — mesmo drift, mesmos docs.
    fix: |
      Alinhar docs/STACK.md:146 e docs/TEMPLATE_USAGE.md:168 em 1.12.0 (destrava o
      release v1.12.0). E o que impede a recorrencia: gate no preflight
      (.tooling/scripts/ci/check-version-footers.ts) que falhe quando os 4 footers
      divergem entre si, rodando no PR e nao so no release; mais um script que
      escreva os 4 footers de uma vez.
    breaking_change: false
    confirmed_by: [release-versioning-specialist]

