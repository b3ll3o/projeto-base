services:
  api:
    build: { target: dev }
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://projeto:projeto@postgres:5432/projeto_base?schema=public
      # ⚠️ #118: o bucket de SISTEMA é concedido pela CREDENCIAL
      # (`current_user = 'app_system'`), e o LOGIN é o caminho que o abre
      # (`findByEmail(email, null)`). Sem esta linha, `clienteDeSistema()`
      # LANÇA no primeiro login — 500, e o dev conclui que a senha está errada.
      #
      # Aponta para o DONO pelo mesmo motivo do `DATABASE_URL` acima: esta
      # stack conecta como DONO (as policies de RLS não valem aqui — quem as
      # exercita de verdade é
      # `src/shared/infrastructure/prisma/prisma-rls.integration.spec.ts`, que
      # sobe o seu próprio container). O papel `app_system` só existe depois
      # da migration `20261027000001`, e esta stack roda `pnpm dev`, sem
      # migrate.
      SYSTEM_DATABASE_URL: postgresql://projeto:projeto@postgres:5432/projeto_base?schema=public
    volumes:
      - ./apps/api/src:/repo/apps/api/src:ro
      - ./apps/api/prisma:/repo/apps/api/prisma:ro
      - api_node_modules:/repo/node_modules
      - api_apps_modules:/repo/apps/api/node_modules
    command: ['pnpm', '--filter', '@projeto/api', 'dev']
  web:
    build: { target: dev }
    environment:
      NODE_ENV: development
      API_BASE_URL: http://api:3000/api/v1
    volumes:
      - ./apps/web/app:/repo/apps/web/app:ro
      - ./apps/web/lib:/repo/apps/web/lib:ro
      - ./apps/web/public:/repo/apps/web/public:ro
      - web_node_modules:/repo/node_modules
      - web_apps_modules:/repo/apps/web/node_modules
      - web_next:/repo/apps/web/.next
    command: ['pnpm', '--filter', '@projeto/web', 'dev']
volumes:
  api_node_modules:
  api_apps_modules:
  web_node_modules:
  web_apps_modules:
  web_next:
