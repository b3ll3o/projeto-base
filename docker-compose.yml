# docker-compose.yml
services:
  postgres:
    image: postgres:16-alpine
    container_name: projeto-base-postgres
    environment:
      POSTGRES_USER: projeto
      POSTGRES_PASSWORD: projeto
      POSTGRES_DB: projeto_base
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U projeto']
      interval: 5s
      timeout: 5s
      retries: 5
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: prod
    container_name: projeto-base-api
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://projeto:projeto@postgres:5432/projeto_base?schema=public
      LOG_LEVEL: info
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: prod
    container_name: projeto-base-web
    environment:
      NODE_ENV: production
      PORT: 3001
      API_BASE_URL: http://api:3000/api/v1
    ports:
      - '3001:3001'
    depends_on:
      - api

volumes:
  postgres_data:
