# docker-compose.yml
# Issues resolvidas: #68 (plaintext password + DATABASE_URL placeholder), #74 (digest pinning), #75 (mem_limit + memory_limiter)
services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    container_name: projeto-base-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-projeto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} # #68: nunca plaintext; falha explícita se não setado
      POSTGRES_DB: ${POSTGRES_DB:-projeto_base}
    env_file:
      - .env.production # #68: secrets em arquivo separado, fora do compose versionado
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER:-projeto}"']
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M # #75: teto de memória explícito
        reservations:
          memory: 256M
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: prod
    container_name: projeto-base-api
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL} # #68: obrigatório via env, sem placeholder literal
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3001} # #73: consumido pelo main.ts
    env_file:
      - .env.production # #68: secrets fora do compose versionado
    # ⚠️ `JWT_SECRET` NÃO aparece neste bloco, e é deliberado — duas medições
    # successive fecharam as duas formas "óbvias" de colocá-lo:
    #
    # 1. NÃO pode ser `${JWT_SECRET:?...}`. O Compose interpola o arquivo
    #    INTEIRO antes de executar QUALQUER comando, então a exigência é
    #    avaliada mesmo para `config`, `ps` e `down`. MEDIDO: com o `:?` e a
    #    variável ausente, os três saem 1 — e o caso real, `up -d postgres`,
    #    também. Uma stack quebrada ficava impossível de derrubar. Pior: a
    #    interpolação roda ANTES do `env_file` ler o arquivo, então a exigência
    #    não é satisfeita por quem mora no `.env.production`, que é justamente
    #    onde a convenção #68 manda o segredo morar.
    # 2. NÃO pode ser `${JWT_SECRET:-}`. MEDIDO: chave presente em
    #    `environment` ganha de `env_file` mesmo quando resolve para string
    #    vazia — `docker compose config` imprime `JWT_SECRET: ""` e descarta o
    #    valor do `.env.production`. Um default vazio aqui não é "neutro", é
    #    "apaga o segredo que o outro arquivo tinha".
    #
    # Sem a chave, o `env_file` decide: o segredo mora no `.env.production`
    # (ver `.env.production.example`) e a ausência é punida onde o problema é
    # real — o `JwtTokenService` recusa o boot, e o healthcheck do serviço
    # reprova. Fail-fast no lugar certo, sem transformar o compose num
    # arquivo que o Postgres também não consegue ler.
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:3000/api/v1/health || exit 1']
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: prod
    container_name: projeto-base-web
    environment:
      NODE_ENV: production
      PORT: 3001
      API_BASE_URL: http://api:3000/api/v1
    ports:
      - '3001:3001'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "require(''http'').get(''http://localhost:3001/api/health'',r=>process.exit(r.statusCode===200?0:1)).on(''error'',()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    restart: unless-stopped
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.103.0@sha256:0dffde3e58fc3f255cad861deb62d7c51505ce961a8a7e2107c7fc2668b774a3 # #74
    profiles: [observability]
    command: ['--config=/etc/otelcol/config.yaml']
    volumes:
      - ./infra/otelcol/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - '4317:4317' # OTLP gRPC
      - '4318:4318' # OTLP HTTP
    deploy:
      resources:
        limits:
          memory: 512M # #75: teto de memória explícito
        reservations:
          memory: 256M
    restart: unless-stopped

volumes:
  postgres_data:
