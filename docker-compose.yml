# docker-compose.yml
services:
  postgres:
    image: postgres:16-alpine
    container_name: projeto-base-postgres
    environment:
      POSTGRES_USER: projeto
      POSTGRES_PASSWORD: projeto
      POSTGRES_DB: projeto_base
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U projeto']
      interval: 5s
      timeout: 5s
      retries: 5
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: prod
    container_name: projeto-base-api
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://projeto:projeto@postgres:5432/projeto_base?schema=public
      LOG_LEVEL: info
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:3000/api/v1/health || exit 1']
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: prod
    container_name: projeto-base-web
    environment:
      NODE_ENV: production
      PORT: 3001
      API_BASE_URL: http://api:3000/api/v1
    ports:
      - '3001:3001'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "require(''http'').get(''http://localhost:3001/api/health'',r=>process.exit(r.statusCode===200?0:1)).on(''error'',()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3
    depends_on:
      api:
        condition: service_healthy
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.103.0
    profiles: [observability]
    command: ['--config=/etc/otelcol/config.yaml']
    volumes:
      - ./infra/otelcol/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - '4317:4317' # OTLP gRPC
      - '4318:4318' # OTLP HTTP

volumes:
  postgres_data:
