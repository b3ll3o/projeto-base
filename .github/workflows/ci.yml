name: ci
on:
  # MEDIDO 2026-10-15: `feat/**` deixava de fora 4 branches vivas
  # (`fix/**`, `docs/**`) — 0 runs de CI no push delas, MEDIDO em
  # `gh run list --workflow ci.yml --event push --limit 100` (91 runs, 0 em
  # `main`) — e o resultado do merge nunca era validado, porque
  # `pull_request` só dispara na abertura/sincronização do PR.
  # `**` cobre `main` também, que era justamente o buraco: o push pós-merge
  # não tinha job nenhum. `**` é o único glob que não volta a precisar de
  # lista quando alguém cria uma branch com prefixo novo.
  push:
    branches: ['**']
  pull_request:
    branches: [main]
    # MEDIDO 2026-10-15: sem `edited`, corrigir o corpo do PR não dispara nada
    # — o gate do marcador lê `github.event.pull_request.body`, que é o snapshot
    # do evento, e um re-run entrega o snapshot velho. Medido no #81: o corpo
    # dizia `43 commits, 161 arquivos`, a contagem real já era 47/167, o
    # `pr-refresh-gate` reprovou com `2 claim(s) divergente(s)`, e corrigir o
    # corpo não conseguiu reprovar — só um push de código (ou um
    # close/reopen) redespertaria. Listar `types` SUBSTITUI o padrão
    # (`opened, synchronize, reopened`), então os quatro precisam estar.
    types: [opened, synchronize, reopened, edited]

# MEDIDO 2026-10-15: existem runs do `ci.yml` com `[createdAt, updatedAt]`
# sobrepostos no MESMO grupo de concurrency — sem isto, cada push novo deixava a
# run velha queimando os ~4 min do `quality` em código já superseded.
#
# O NÚMERO de pares fica de fora de propósito: medido com interseção de
# `[createdAt, updatedAt]` dá 10 entre push/push (mesma branch) e 19 entre
# PR/PR, e depende de quais runs entram na janela. As variantes não fecham entre
# si — um número publicado aqui envelhece a cada run nova e é exatamente o tipo
# de claim que o resto deste arquivo evita. Para remedir:
#   gh run list --workflow ci.yml --event push --limit 100 \
#     --json headBranch,createdAt,updatedAt
#
# `cancel-in-progress` NÃO pode ser `true` incondicional: o GitHub decide o
# cancelling comparando quem começou mais tarde, e um RE-RUN de código
# superseded começa sempre mais tarde que a run boa — o "mais recente vence"
# fica invertido justamente no caso que não deveria vencer.
#
# MEDIDO no #81: a run `38800220277` (20:13:40, payload com o corpo já
# corrigido, gate em `0 claim(s) divergente(s)`) foi CANCELADA às 20:19:26
# porque um re-run da run velha `38799524907` começou às 20:18:31 no mesmo
# grupo `ci-81`. O re-run entrega o payload de 20:08:22 e reprovou com
# `1 claim(s) divergente(s)` — a contagem velha que já tinha sido corrigida.
# Clicar em "Re-run failed jobs" era armadilha: matava a run saudável e
# reinstalava a falha que a edição do corpo tinha eliminado.
#
# `github.run_attempt` vale 1 na primeira execução e incrementa a cada re-run
# (docs.github.com/en/actions/reference/workflows-and-actions/contexts — o bloco
# `concurrency` aceita o contexto `github`). Só a execução que representa
# código novo cancela; o re-run, nunca.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.run_attempt == 1 }}

jobs:
  # pt-BR: preflight detecta drift estrutural (cross-refs quebradas em
  # docs/specs, tsconfig drift, ESLint config legada) em ~10s antes do
  # quality rodar lint/typecheck/test (~4min). Falha rápido.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # `fetch-depth: 0` é exigência do gate do marcador, não preferência: com o
      # default (depth 1) o checkout de `pull_request` traz só o ref de merge e
      # `origin/main` não tem ancestral comum com HEAD — o `varrerTexto` levanta
      # "base sem ancestral comum" e o gate morre com stack trace.
      # MEDIDO no PR #53: preflight vermelho por exatamente isso.
      #
      # `ref` no head da branch, e não no ref de merge: o merge ref que o
      # GitHub fabrica tem DOIS pais (base + head) e `rev-list --count
      # base..HEAD` conta o próprio commit sintético junto. O erro é sempre
      # **exatamente 1**, qualquer que seja a branch — e todo corpo de PR
      # escrito localmente diverge em 1 no CI.
      # MEDIDO no PR #53 (os números de cada par crescem a cada push; o que
      # não muda é a diferença): merge ref `dec7a89` (pais `8de508a` +
      # `095c043`) → 8, head `095c043` → 7; depois, merge ref `d206727`
      # (pais `8de508a` + `d56ce17`) → 9, head `d56ce17` → 8.
      # É o mesmo gate, medindo duas branchs diferentes.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # pt-BR: o format:check é o check mais barato do preflight (~2.4s) e
      # roda antes de ci:preflight para falhar ainda mais rápido. Até v1.8.0
      # nenhum gate de formatação existia fora do lint-staged local — drift
      # entrava por squash-merge da UI ou por --no-verify.
      - name: Run format check
        run: pnpm format:check
      - name: Run preflight checks
        run: pnpm ci:preflight
      # pt-BR: a suite de .tooling/scripts/ci (os checks do preflight) nao
      # rodava em lugar nenhum ate v1.9.1 — e por isso que 3 specs ficaram
      # vermelhos sem ninguem perceber. Rodar no job que ja falha rapido.
      - name: Run tooling tests
        run: pnpm tooling:test
      # pt-BR: issue #45 item 4. O `pr-refresh` so reescreve claims no
      # paragrafo marcado; sem marcador ele roda, mede, NAO escreve e sai com
      # "sem-marcador" — que o `.husky/pre-push` engole por decisao de owner
      # ("nunca bloqueia"). Sem um gate, todo PR nasce inativo e ninguem e
      # avisado: foi assim que o corpo do #44 mentiu por 2 commits, 5 arquivos
      # e 1613 linhas. Aqui o gate BLOQUEIA, que e o que job de CI faz.
      # Fora de `pull_request` nao ha PR: o gate e do PR, nao do push.
      #
      # O corpo vem do PAYLOAD do evento (`pull_request.body`), nao de `gh`:
      # ler o PR que disparou a run nao exige token nenhum, entao o job segue
      # com `permissions: contents: read` como estava. Conceder
      # `pull-requests: read` seria trocar um arquivo por uma permissao nova.
      #
      # O payload e um SNAPSHOT do momento do push. Editar o corpo depois nao
      # dispara run (o tipo default de `pull_request` e opened/synchronize/
      # reopened; `edited` nao esta nele), e um re-run entrega o payload
      # antigo — a unica forma de o CI validar um corpo corrigido e o proximo
      # push. MEDIDO no PR #53: corrigi a contagem depois de pushar, e a run
      # seguinte reprovou com o corpo que eu ja tinha consertado.
      # REGRA OPERACIONAL: ajuste o corpo ANTES de pushar.
      #
      # A semantica e a desejada — o gate valida o que foi submetido junto com
      # o codigo, nao o que o corpo virou depois. O custo e ter que pushar de
      # novo para revalidar, e ele e visivel (a run reprova) em vez de
      # silencioso.
      - name: Gate do marcador pr-refresh
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE: origin/${{ github.event.pull_request.base.ref }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          PR_BODY_FILE="$RUNNER_TEMP/pr-body.md" pnpm pr:marker
  quality:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # pt-BR: os três passos de Playwright (abaixo) somam bootstrap + install +
    # specs, contra um teto de 20 min que existia bem antes deles. MEDIDO
    # 2026-10-08: `gh run view 37796560291 --json jobs` dá o job `quality` em
    # **1m11s** (14:57:06 → 14:58:17) SEM nenhum passo de e2e; e no log de duas
    # execuções locais o `next build` levou **34,5s** e **34,8s** ("build
    # concluído em …" do `globalSetup`), com o setup inteiro em 40,7s e 41,4s.
    # Somando Postgres, migrate, install e specs, a projeção fica em 5-8 min
    # contra 20 — folga de ~3×. O timeout fica como está: mexer agora seria
    # trocar um número medido por outro chutado. Reavaliar se a suíte e2e
    # ganhar outros fluxos.
    # pt-BR: apps/api/test/testcontainers-helper.ts sobe Postgres próprio
    # (PostgreSqlContainer 'postgres:16-alpine') e sobrepõe DATABASE_URL.
    # Não usar service postgres aqui — é dead code.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run db:generate
      - run: pnpm turbo run lint typecheck
      # Cobertura (gate-enforced) + unit para todos os apps via turbo task graph.
      - run: pnpm turbo run test:coverage test:unit
      # Integration + E2E de API rodam em apps/api; o E2E de FRONTEND é a suíte
      # Playwright, logo abaixo, e ela sobe Postgres + API + Next por conta própria
      # (e2e/global-setup.ts) — não reaproveita nada deste passo.
      - run: pnpm turbo run test:integration test:e2e --filter=@projeto/api
      # pt-BR: o `--filter` é obrigatório, não cosmético. `@playwright/test` está
      # nos devDependencies do web e o pnpm isola `node_modules`: na raiz,
      # `pnpm exec playwright` não resolve e sai 0 sem instalar nada — o pior tipo
      # de passo de CI, o que parece verde e não mediu nada.
      - run: pnpm --filter @projeto/web exec playwright install --with-deps chromium
      - run: pnpm turbo run test:e2e --filter=@projeto/web
      # Relatório + traces SEMPRE, inclusive quando o teste falha: um e2e que
      # quebra sem artefato é um e2e que a próxima pessoa desativa.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14
      # Upload de cobertura como artifact para auditoria (cobertura-testes.md §CI Enforcement).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            apps/api/coverage/
            apps/web/coverage/
          retention-days: 30
  # pt-BR: smoke job que builda os Dockerfiles prod completos. Defesa em profundidade
  # contra bugs latentes tipo `COPY --from=builder <path>` relativo (que só aparece
  # quando o cache do build local difere do cache CI). Roda só em PR para não
  # inflar todo push em ~5min de cold cache.
  #
  # `needs: preflight` + `if:` sem função de status ⇒ o GitHub aplica um
  # `success()` implícito: quando o `preflight` reprova, este job é SKIPPED, e
  # é isso que se quer — são ~5min de build numa run já condenada. O mesmo
  # mecanismo que já vale para o `quality`. Está aqui escrito porque um `if:`
  # sem função de status parece omission e é decisão.
  docker-build-prod:
    needs: preflight
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: docker/setup-buildx-action@v3
      - name: Build api prod (smoke)
        run: docker buildx build -f apps/api/Dockerfile --target prod -t projeto-api:smoke --load .
      - name: Build web prod (smoke)
        run: docker buildx build -f apps/web/Dockerfile --target prod -t projeto-web:smoke --load .
