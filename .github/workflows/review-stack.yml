name: stack-code-review
on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      # MEDIDO 2026-10-15: `.tooling/` (44 arquivos rastreados — os gates do
      # `ci:preflight`) é um diretório DIFERENTE de `tooling/`, e a glob
      # `tooling/**` não o cobre: uma mudança só em `.tooling/` não disparava
      # este reviewer. Os dois precisam estar.
      - 'tooling/**'
      - '.tooling/**'
      - '.agents/**'

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run stack-code-reviewer
        run: |
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.(ts|tsx|prisma)$' || true)
          if [ -n "$changed" ]; then
            pnpm stack:review --files="$changed" --mode=ci --out-file=stack-review-report.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stack-review-report
          path: stack-review-report.json
