name: docs-sync
on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'tooling/**'
      - 'docs/**'
      - '.agents/**'

# pt-BR (#131): o PISO de privilégio do workflow. Este workflow roda em
# `pull_request` — conteúdo de terceiro — e só faz duas coisas: ler o diff e
# rodar o `doc-sync`. As duas cabem em `contents: read`.
#
# Sem este bloco, o `GITHUB_TOKEN` herda o default do repositório, que é
# configuração de fora do repo — e pode ser mais largo do que o necessário.
permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          # pt-BR (#131): o token NÃO fica em `.git/config` da workspace.
          # Nenhum push é feito aqui — e o `pull_request` roda conteúdo de
          # terceiro, onde um token deambora seria o prêmio.
          persist-credentials: false
      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run doc-sync
        run: |
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD || true)
          if [ -n "$changed" ]; then
            pnpm docs:sync --files="$changed" --mode=full --out-file=doc-sync-report.json
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: doc-sync-report
          path: doc-sync-report.json
