name: delete-merged-branch

# Apaga a branch do PR assim que o PR é MERGEADO.
#
# É o instrumento da regra de
# [`git-workflow.md`](../../.agents/specs/conventions/git-workflow.md)
# §"Branch Morta: Apagar Quando o PR Sai de OPEN": a regra diz que a branch
# mergeada está morta, e este workflow é quem a apaga — sem depender de
# ninguém lembrar.
#
# Por que um workflow próprio: nenhum evento de `push` vê o PR FECHADO.
# `pull_request: closed` é o único gatilho que sabe se o PR foi mergeado.
#
# Por que só MERGED: PR fechado SEM merge precisa do exame de conteúdo
# (apêndice §Caso 3) — apagar no escuro perde trabalho que ninguém mais tem.
on:
  pull_request:
    types: [closed]

# pt-BR (#131): este workflow é o ÚNICO que precisa escrever no repo — ele
# apaga a ref da branch. Todo o resto do CI é `contents: read`.
permissions:
  contents: write

jobs:
  delete:
    # `merged` decide: `false` (PR fechado sem merge, ou reaberto) não apaga.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Apagar a branch mergeada
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail

          # Branch de FORK: a ref vive no outro repositório — o DELETE aqui é
          # 404 e não é a branch que a regra quer apagar.
          if [ "$HEAD_REPO" != "$REPO" ]; then
            echo "::notice::branch de fork ($HEAD_REPO) — nada a apagar aqui"
            exit 0
          fi

          # O nome da branch vai na URL: `#` e `?` são LEGAIS no git e no
          # GitHub, e na URL são fragmento e query. Sem encoding, `feature/x#1`
          # vira `feature/x` — e o DELETE apagaria a branch errada. O `/` do
          # path de branch é preservado (é separador de path, não caractere).
          BRANCH_ENC=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe='/'))" "$BRANCH")

          # PR EMPILHADO: a branch é a BASE de outro PR aberto. Apagá-la
          # quebra o PR de cima. O botão "Delete branch" do GitHub tem o mesmo
          # efeito, mas aqui a falha é automática e silenciosa — por isso a
          # checagem é explícita.
          bases=$(gh api "repos/$REPO/pulls?state=open&base=$BRANCH_ENC" --jq '[.[] | select(.base.ref == env.BRANCH)] | length')
          if [ "$bases" != "0" ]; then
            echo "::notice::a branch $BRANCH é a base de $bases PR(s) aberto(s) — não apaga"
            exit 0
          fi

          # O GET devolve a ref inteira: `git/ref/heads/<branch>`. O 404 é o
          # caso "a branch já não existe" (o botão do GitHub, ou um
          # `push --delete` manual) — sai com aviso. Qualquer OUTRO erro
          # (403, 500) é erro de verdade: engolir aqui seria apagar branch
          # nenhuma e sair verde.
          if ! resposta=$(gh api --include "repos/$REPO/git/ref/heads/$BRANCH_ENC" 2>&1); then
            if printf '%s' "$resposta" | grep -qE '^HTTP/[0-9.]+ 404' ||
               printf '%s' "$resposta" | grep -q '"status":"404"'; then
              echo "::notice::a branch $BRANCH já não existe"
              exit 0
            fi
            echo "::error::não deu para ler a ref $BRANCH: $resposta"
            exit 1
          fi

          # A CONFERÊNCIA é o que fecha o buraco do encoding: mesmo que a URL
          # tenha sido interpretada de outro jeito, a ref lida precisa ser
          # EXATAMENTE a branch do PR. Se não for, o DELETE é de outra branch.
          ref=$(printf '%s\n' "$resposta" | grep -oE '"ref":"[^"]+"' | head -1 | sed 's/^"ref":"//; s/"$//')
          if [ "$ref" != "refs/heads/$BRANCH" ]; then
            echo "::error::a ref lida ($ref) não é a branch do PR ($BRANCH) — não apago"
            exit 1
          fi

          gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH_ENC"
          echo "::notice::branch $BRANCH apagada (PR merged)"
